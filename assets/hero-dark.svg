<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#131A2A"/>
    </linearGradient>
    <radialGradient id="glowc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="260" fill="url(#hbg)"/>
  <circle cx="1040" cy="60" r="220" fill="url(#glowc)"/>
  <circle cx="1130" cy="210" r="160" fill="url(#glowm)"/>
  <g stroke="#30363D" stroke-width="1" opacity="0.6">
    <line x1="880" y1="0" x2="880" y2="260"/>
    <line x1="960" y1="0" x2="960" y2="260"/>
    <line x1="1040" y1="0" x2="1040" y2="260"/>
    <line x1="1120" y1="0" x2="1120" y2="260"/>
  </g>
  <text x="48" y="108" fill="#C9D1D9" font-size="46" font-weight="700">AKASH VERMA</text>
  <text x="50" y="146" fill="#22D3EE" font-size="21" font-weight="700">SRE &amp; Cloud Architect 🛡️</text>
  <text x="50" y="176" fill="#7D8590" font-size="14.5">Bridging infrastructure, data and machine learning, one 3am page at a time ⚡</text>
  <text x="50" y="210" fill="#39D353" font-size="13.5" font-weight="600">10+ yrs 🕒  ·  1,000+ nodes 🖥️  ·  99.99% uptime ✅  ·  Multi-cloud (public + private) ☁️</text>

  <rect x="944" y="20" width="206" height="220" rx="10" fill="#131A2A" stroke="#30363D"/>
  <line x1="944" y1="40" x2="1150" y2="40" stroke="#30363D"/>
  <circle cx="954" cy="30" r="4" fill="#ff5f56"/>
  <circle cx="966" cy="30" r="4" fill="#ffbd2e"/>
  <circle cx="978" cy="30" r="4" fill="#27c93f"/>
  <text x="1047" y="33.5" fill="#7D8590" font-size="9" text-anchor="middle">whoami.png</text>
  <clipPath id="photoReveal">
    <rect x="949" y="45" width="196" height="0">
      <animate attributeName="height" from="0" to="190" begin="0.2s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
  </clipPath>
  <g clip-path="url(#photoReveal)">
    <image href="akash-image.png" x="949" y="45" width="196" height="190" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="949" y="45" width="196" height="190" rx="2" fill="none" stroke="#30363D" stroke-opacity="0.6"/>
</svg>
